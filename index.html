<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nimbus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#dee1e6;display:flex;flex-direction:column}
#tabs{display:flex;gap:2px;padding:6px 6px 0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;max-width:200px;min-width:100px;padding:7px 10px;background:#cfd2d8;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px}
.tab.active{background:#fff}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab button{border:0;background:none;cursor:pointer;font-size:15px}
#plus{border:0;background:none;font-size:20px;cursor:pointer;padding:0 10px}
#bar{display:flex;gap:6px;padding:6px;background:#fff;border-bottom:1px solid #ccc}
#bar button{border:0;background:#f1f3f4;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
#url{flex:1;border:0;background:#f1f3f4;border-radius:16px;padding:0 14px;font-size:14px;outline:none}
#views{flex:1;position:relative}
webview{position:absolute;inset:0;display:none}
webview.active{display:flex}
</style></head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button id="back">←</button><button id="fwd">→</button><button id="reload">⟳</button><button id="home">⌂</button>
  <input id="url" placeholder="Search or type a URL">
</div>
<div id="views"></div>
<script src="renderer.js"></script>
</body></html>
