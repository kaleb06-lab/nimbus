<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>New Tab</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0f172a,#1e3a8a 60%,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center}
main{text-align:center;width:min(640px,90%)}
h1{font-size:64px;margin:0 0 6px;letter-spacing:2px;font-weight:300}
p{margin:0 0 28px;opacity:.7}
form{display:flex;background:#fff;border-radius:30px;padding:6px 8px 6px 20px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
input{flex:1;border:0;outline:none;font-size:18px;background:none;color:#111}
button{border:0;background:#4f46e5;color:#fff;border-radius:22px;padding:10px 22px;font-size:15px;cursor:pointer}
</style></head>
<body><main>
<h1>☁ Nimbus</h1>
<p>Browse the web, your way.</p>
<form action="https://www.google.com/search" method="get">
  <input name="q" placeholder="Search the web" autofocus autocomplete="off">
  <button>Search</button>
</form>
</main></body></html>
